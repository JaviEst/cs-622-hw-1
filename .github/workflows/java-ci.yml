name: Java CI

# Trigger the workflow on push or pull request for any branch
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-test-checkstyle:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Compile the project
      - name: Compile project
        run: mvn compile

      # Step 4: Run tests
      - name: Run tests
        run: mvn test

      # Step 5: Run Checkstyle
      - name: Run Checkstyle
        run: mvn checkstyle:check
